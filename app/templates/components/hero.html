<!-- Hero Section Component -->
<section id="home" class="min-h-screen flex items-center justify-center relative overflow-hidden pt-20 tech-grid">
    <!-- Animated Geometric Particles -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <!-- Floating Squares -->
        <div class="particle absolute w-4 h-4 bg-primary-500/30 border border-primary-500/50" style="top: 10%; left: 10%; --tx: 100px; --ty: -200px; --duration: 12s; --delay: 0s;"></div>
        <div class="particle absolute w-6 h-6 bg-accent-500/20 border border-accent-500/40" style="top: 20%; right: 15%; --tx: -150px; --ty: -250px; --duration: 15s; --delay: 2s;"></div>
        <div class="particle absolute w-5 h-5 bg-primary-400/25 border border-primary-400/45" style="top: 70%; left: 5%; --tx: 120px; --ty: -180px; --duration: 10s; --delay: 1s;"></div>
        <div class="particle absolute w-3 h-3 bg-primary-500/35 border border-primary-500/55" style="top: 40%; right: 20%; --tx: -100px; --ty: -220px; --duration: 14s; --delay: 3s;"></div>
        <div class="particle absolute w-7 h-7 bg-accent-500/15 border border-accent-500/35" style="top: 60%; right: 10%; --tx: -180px; --ty: 200px; --duration: 16s; --delay: 4s;"></div>
        <div class="particle absolute w-4 h-4 bg-primary-400/30 border border-primary-400/50" style="top: 30%; left: 25%; --tx: 90px; --ty: -150px; --duration: 11s; --delay: 1.5s;"></div>
        
        <!-- Diagonal Lines -->
        <div class="absolute top-0 left-1/4 w-px h-full bg-gradient-to-b from-transparent via-primary-500/20 to-transparent opacity-30"></div>
        <div class="absolute top-0 right-1/3 w-px h-full bg-gradient-to-b from-transparent via-accent-500/20 to-transparent opacity-30"></div>
        
        <!-- Scanline Effect -->
        <div class="scanline opacity-30"></div>
    </div>
    
    <!-- Modern Geometric Background -->
    <div class="absolute inset-0 opacity-20">
        <div class="absolute top-20 left-10 w-96 h-96 bg-primary-500 rounded-none rotate-45 blur-3xl animate-float-geometric"></div>
        <div class="absolute bottom-20 right-10 w-80 h-80 bg-accent-500 rounded-none -rotate-12 blur-3xl animate-float-geometric" style="animation-delay: -5s;"></div>
        <div class="absolute top-1/2 left-1/2 w-72 h-72 bg-primary-400 rounded-none rotate-12 blur-3xl animate-float-geometric" style="animation-delay: -10s;"></div>
    </div>
    
    <!-- Pulse Rings -->
    <div class="absolute top-1/4 right-1/4 w-32 h-32 border-2 border-primary-500/30 pulse-ring" style="animation-delay: 0s;"></div>
    <div class="absolute bottom-1/3 left-1/3 w-40 h-40 border-2 border-accent-500/30 pulse-ring" style="animation-delay: 1s;"></div>
    
    <div class="container mx-auto px-6 relative z-10">
        <div class="flex flex-col md:flex-row items-center justify-between gap-12">
            <!-- Left Content -->
            <div class="flex-1 text-center md:text-left" data-aos="fade-right" data-aos-duration="800">
                <div class="inline-block mb-4">
                    <span class="bg-gradient-to-r from-primary-500 to-accent-500 px-6 py-2 font-bold text-sm tracking-wider uppercase border-l-4 border-accent-500">
                        <i class="bi bi-award-fill mr-2"></i>Professional Designer
                    </span>
                </div>
                
                <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight diagonal-wipe">
                    Hi, I'm 
                    <span class="holographic bg-clip-text text-transparent font-black">
                        {{ data.name }}
                    </span>
                </h1>
                
                <h2 class="text-2xl md:text-4xl text-gray-300 mb-6 font-semibold">
                    <span id="typed-text"></span>
                    <span class="animate-pulse">|</span>
                </h2>
                
                <p class="text-lg text-gray-400 mb-8 max-w-2xl">
                    {{ data.bio }}. I craft intuitive digital experiences that bridge the gap between users and technology, combining aesthetics with functionality to create designs that resonate.
                </p>
                
                <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start stagger-item">
                    <a href="/#projects" class="group relative bg-gradient-to-r from-primary-500 to-primary-600 px-8 py-4 font-bold overflow-hidden transition-all duration-500 hover:shadow-2xl hover:shadow-primary-500/50 border-l-4 border-accent-500 magnetic hover:-translate-y-1 hover:scale-105">
                        <span class="relative z-10 flex items-center justify-center">
                            View My Work
                            <i class="bi bi-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-accent-500 to-accent-600 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"></div>
                        <!-- Corner accents -->
                        <div class="absolute top-0 right-0 w-2 h-2 bg-accent-500"></div>
                        <div class="absolute bottom-0 left-0 w-2 h-2 bg-accent-500"></div>
                    </a>
                    <a href="/#contact" class="relative border-2 border-primary-500 px-8 py-4 font-bold hover:bg-primary-500/10 transition-all duration-500 overflow-hidden group magnetic hover:-translate-y-1 hover:scale-105">
                        <span class="relative z-10 flex items-center justify-center">
                            <i class="bi bi-envelope mr-2"></i>
                            Get In Touch
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-primary-500/20 to-accent-500/20 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"></div>
                        <!-- Animated border -->
                        <div class="absolute inset-0 border-2 border-transparent group-hover:border-accent-500 transition-all duration-300"></div>
                    </a>
                </div>
            </div>
            
            <!-- Right Content - Profile Image -->
            <div class="flex-1 flex justify-center" data-aos="fade-left" data-aos-duration="800">
                <div class="relative group">
                    <!-- Animated Angular frame effects -->
                    <div class="absolute -inset-4 border-2 border-primary-500 transform rotate-3 opacity-50 transition-all duration-500 group-hover:rotate-6 group-hover:scale-105"></div>
                    <div class="absolute -inset-6 border-2 border-accent-500 transform -rotate-3 opacity-30 transition-all duration-500 group-hover:-rotate-6 group-hover:scale-105"></div>
                    
                    <!-- Geometric accent pieces -->
                    <div class="absolute -top-8 -left-8 w-16 h-16 border-l-4 border-t-4 border-primary-500 opacity-60 transition-all duration-500 group-hover:scale-110"></div>
                    <div class="absolute -bottom-8 -right-8 w-16 h-16 border-r-4 border-b-4 border-accent-500 opacity-60 transition-all duration-500 group-hover:scale-110"></div>
                    
                    <!-- Avatar container with 3D effect -->
                    <div class="relative w-64 h-64 md:w-96 md:h-96 overflow-hidden shadow-2xl clip-corner card-3d">
                        <div class="absolute inset-0 bg-gradient-to-br from-primary-500/30 to-accent-500/30 group-hover:from-primary-500/40 group-hover:to-accent-500/40 transition-all duration-500"></div>
                        <img src="https://via.placeholder.com/400" alt="Profile" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        <!-- Animated Accent bars -->
                        <div class="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-primary-500 to-accent-500 transition-all duration-500 group-hover:w-3"></div>
                        <div class="absolute bottom-0 right-0 w-full h-2 bg-gradient-to-r from-primary-500 to-accent-500 transition-all duration-500 group-hover:h-3"></div>
                        <!-- Scanline overlay -->
                        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-primary-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 animate-sharp-bounce"></div>
                    </div>
                    
                    <!-- Floating elements with sharp design and advanced animations -->
                    <div class="absolute -top-4 -right-4 bg-gradient-to-br from-primary-500 to-primary-600 p-4 border-l-4 border-accent-500 shadow-xl animate-sharp-bounce group-hover:scale-110 transition-transform duration-500 cursor-pointer relative" style="animation-delay: 0s;">
                        <i class="bi bi-pencil-square text-3xl"></i>
                        <div class="absolute inset-0 border border-primary-400/0 group-hover:border-primary-400/50 transition-all duration-300"></div>
                    </div>
                    <div class="absolute -bottom-4 -left-4 bg-gradient-to-br from-accent-500 to-accent-600 p-4 border-l-4 border-primary-500 shadow-xl animate-sharp-bounce group-hover:scale-110 transition-transform duration-500 cursor-pointer relative" style="animation-delay: 0.75s;">
                        <i class="bi bi-palette text-3xl"></i>
                        <div class="absolute inset-0 border border-primary-400/0 group-hover:border-primary-400/50 transition-all duration-300"></div>
                    </div>
                    
                    <!-- Additional floating tech icons -->
                    <div class="absolute top-1/2 -left-12 bg-slate-800/80 backdrop-blur-sm p-3 border-2 border-primary-500/50 shadow-lg animate-float-geometric opacity-0 group-hover:opacity-100 transition-all duration-500">
                        <i class="bi bi-vector-pen text-xl text-primary-400"></i>
                    </div>
                    <div class="absolute top-1/3 -right-12 bg-slate-800/80 backdrop-blur-sm p-3 border-2 border-accent-500/50 shadow-lg animate-float-geometric opacity-0 group-hover:opacity-100 transition-all duration-500" style="animation-delay: -5s;">
                        <i class="bi bi-bezier text-xl text-accent-400"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Scroll Indicator -->
        <div class="mt-16 flex justify-center animate-bounce-slow" data-aos="fade-up" data-aos-delay="400">
            <a href="/#about" class="group relative flex flex-col items-center bg-slate-800/50 backdrop-blur-sm px-6 py-4 border-2 border-primary-500/30 hover:border-primary-500 transition-all duration-500 overflow-hidden magnetic hover:-translate-y-2">
                <!-- Background gradient overlay -->
                <div class="absolute inset-0 bg-gradient-to-b from-primary-500/0 to-accent-500/0 group-hover:from-primary-500/20 group-hover:to-accent-500/20 transition-all duration-500"></div>
                
                <!-- Border accent -->
                <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-primary-500 to-accent-500 transform scale-y-0 group-hover:scale-y-100 transition-transform duration-500 origin-top"></div>
                
                <!-- Corner accents -->
                <div class="absolute top-0 right-0 w-2 h-2 bg-accent-500 transform scale-0 group-hover:scale-100 transition-transform duration-300"></div>
                <div class="absolute bottom-0 left-0 w-2 h-2 bg-primary-500 transform scale-0 group-hover:scale-100 transition-transform duration-300 delay-75"></div>
                
                <span class="relative z-10 text-sm mb-2 font-bold uppercase tracking-wider text-gray-400 group-hover:text-white transition-colors">Scroll Down</span>
                <i class="relative z-10 bi bi-chevron-down text-2xl text-primary-400 group-hover:text-accent-400 transition-all duration-300 group-hover:translate-y-1"></i>
            </a>
        </div>
    </div>
</section>

<style>
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    .animate-spin-slow {
        animation: spin-slow 20s linear infinite;
    }
</style>
