<!-- Hero Section Component -->
<section id="home" class="min-h-screen flex items-center justify-center relative overflow-hidden pt-20">
    <!-- Modern Geometric Background -->
    <div class="absolute inset-0 opacity-20">
        <div class="absolute top-20 left-10 w-96 h-96 bg-primary-500 rounded-none rotate-45 blur-3xl"></div>
        <div class="absolute bottom-20 right-10 w-80 h-80 bg-accent-500 rounded-none -rotate-12 blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 w-72 h-72 bg-cyan-400 rounded-none rotate-12 blur-3xl"></div>
    </div>
    
    <!-- Grid Pattern Overlay -->
    <div class="absolute inset-0 opacity-5" style="background-image: linear-gradient(#06b6d4 1px, transparent 1px), linear-gradient(90deg, #06b6d4 1px, transparent 1px); background-size: 50px 50px;"></div>
    
    <div class="container mx-auto px-6 relative z-10">
        <div class="flex flex-col md:flex-row items-center justify-between gap-12">
            <!-- Left Content -->
            <div class="flex-1 text-center md:text-left" data-aos="fade-right" data-aos-duration="800">
                <div class="inline-block mb-4">
                    <span class="bg-gradient-to-r from-primary-500 to-accent-500 px-6 py-2 font-bold text-sm tracking-wider uppercase border-l-4 border-accent-500">
                        <i class="bi bi-award-fill mr-2"></i>Professional Designer
                    </span>
                </div>
                
                <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight">
                    Hi, I'm 
                    <span class="bg-gradient-to-r from-primary-400 via-cyan-400 to-accent-500 bg-clip-text text-transparent">
                        {{ data.name }}
                    </span>
                </h1>
                
                <h2 class="text-2xl md:text-4xl text-gray-300 mb-6 font-semibold">
                    <span id="typed-text"></span>
                    <span class="animate-pulse">|</span>
                </h2>
                
                <p class="text-lg text-gray-400 mb-8 max-w-2xl">
                    {{ data.bio }}. I craft intuitive digital experiences that bridge the gap between users and technology, combining aesthetics with functionality to create designs that resonate.
                </p>
                
                <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                    <a href="/#projects" class="group relative bg-gradient-to-r from-primary-500 to-primary-600 px-8 py-4 font-bold overflow-hidden transition-all duration-300 hover:shadow-2xl hover:shadow-primary-500/50 border-l-4 border-accent-500">
                        <span class="relative z-10 flex items-center justify-center">
                            View My Work
                            <i class="bi bi-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-accent-500 to-accent-600 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"></div>
                    </a>
                    <a href="/#contact" class="relative border-2 border-primary-500 px-8 py-4 font-bold hover:bg-primary-500/10 transition-all duration-300 overflow-hidden group">
                        <span class="relative z-10 flex items-center justify-center">
                            <i class="bi bi-envelope mr-2"></i>
                            Get In Touch
                        </span>
                        <div class="absolute inset-0 bg-primary-500/5 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"></div>
                    </a>
                </div>
            </div>
            
            <!-- Right Content - Profile Image -->
            <div class="flex-1 flex justify-center" data-aos="fade-left" data-aos-duration="800">
                <div class="relative">
                    <!-- Angular frame effects -->
                    <div class="absolute -inset-4 border-2 border-primary-500 transform rotate-3 opacity-50"></div>
                    <div class="absolute -inset-6 border-2 border-accent-500 transform -rotate-3 opacity-30"></div>
                    
                    <!-- Avatar container -->
                    <div class="relative w-64 h-64 md:w-96 md:h-96 overflow-hidden shadow-2xl clip-corner">
                        <div class="absolute inset-0 bg-gradient-to-br from-primary-500/30 to-accent-500/30"></div>
                        <img src="https://via.placeholder.com/400" alt="Profile" class="w-full h-full object-cover">
                        <!-- Accent bars -->
                        <div class="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-primary-500 to-accent-500"></div>
                        <div class="absolute bottom-0 right-0 w-full h-2 bg-gradient-to-r from-primary-500 to-accent-500"></div>
                    </div>
                    
                    <!-- Floating elements with sharp design -->
                    <div class="absolute -top-4 -right-4 bg-gradient-to-br from-primary-500 to-primary-600 p-4 border-l-4 border-accent-500 shadow-xl">
                        <i class="bi bi-pencil-square text-3xl"></i>
                    </div>
                    <div class="absolute -bottom-4 -left-4 bg-gradient-to-br from-accent-500 to-accent-600 p-4 border-l-4 border-primary-500 shadow-xl">
                        <i class="bi bi-palette text-3xl"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce-slow">
            <a href="/#about" class="flex flex-col items-center text-gray-400 hover:text-white transition-colors">
                <span class="text-sm mb-2">Scroll Down</span>
                <i class="bi bi-chevron-down text-2xl"></i>
            </a>
        </div>
    </div>
</section>

<style>
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    .animate-spin-slow {
        animation: spin-slow 20s linear infinite;
    }
</style>
